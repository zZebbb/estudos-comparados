<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de campo · Estudos Comparados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: diário de campo de um país. Capa em tela cheia que encolhe na rolagem, texto revelado palavra a palavra,
   galeria horizontal presa à rolagem, mosaico final. Claro de propósito, para contrastar com o globo noturno. */
:root{
  --paper:#F2F4EF; --ink:#14231C; --muted:#5E6B63; --line:rgba(20,35,28,.14);
  --accent:#12862B; --accent2:#FFCE00; --accent3:#D21034;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;color:#fff;mix-blend-mode:difference}
.top a{text-decoration:none;font:500 14px var(--f-body)}
.top .sp{margin-left:auto}

/* capa */
.hero{position:relative;height:180vh}
.hero .stick{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:end start}
.hero .img{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 40%;will-change:transform,clip-path}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55))}
.hero .t{position:relative;z-index:2;color:#fff;padding-bottom:8vh;display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,11vw,170px);line-height:.88;letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 span{display:inline-block;transform:translateY(110%);opacity:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity 1.1s}
.ready .hero h1 span{transform:none;opacity:1}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.flag{width:42px;height:28px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.cap{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:2;color:rgba(255,255,255,.8)}

/* manifesto revelado palavra a palavra */
.manifesto{padding-block:22vh}
.manifesto p{font-family:var(--f-display);font-weight:300;font-size:clamp(28px,4.4vw,64px);line-height:1.12;letter-spacing:-.015em;margin:0;max-width:20ch}
.manifesto p b{font-weight:500;color:var(--accent)}
.manifesto .w{opacity:.14;transition:opacity .25s}
.manifesto .w.on{opacity:1}

/* números */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line)}
.facts div{background:var(--paper);padding:28px 4px;display:flex;flex-direction:column;gap:4px}
.facts b{font-family:var(--f-display);font-size:clamp(44px,6vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:14px}
.fict{color:var(--accent3)}

/* galeria horizontal */
.hscroll{position:relative}
.hscroll .stick{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:24px}
.track{display:flex;gap:24px;will-change:transform;padding-left:max(16px,env(safe-area-inset-left,0px))}
.slide{flex:none;width:min(68vw,760px);margin:0;display:flex;flex-direction:column;gap:10px}
.slide.tall{width:min(42vw,460px)}
.slide .frame{overflow:hidden;border-radius:6px;height:min(62vh,560px)}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.slide.in img{transform:scale(1)}
.slide figcaption{display:flex;gap:12px;align-items:baseline;font-size:14px}
.slide figcaption .mono{color:var(--muted)}
.hhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hhead h2,.sec h2{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,72px);letter-spacing:-.025em;line-height:.95;margin:0}

/* destaque com recorte */
.sec{padding-block:16vh;display:flex;flex-direction:column;gap:32px}
.feature{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center}
.reveal{overflow:hidden;border-radius:6px;clip-path:inset(18% 18% 18% 18% round 6px);transition:clip-path 1.4s cubic-bezier(.2,.8,.2,1)}
.reveal.in{clip-path:inset(0 0 0 0 round 6px)}
.reveal img{width:100%;aspect-ratio:4/5;object-fit:cover}
.feature p{font-size:18px;color:var(--muted);max-width:42ch;margin:0}
.feature h3{font-family:var(--f-display);font-size:32px;font-weight:500;margin:0 0 12px;line-height:1.1}

/* mosaico */
.mosaic{columns:3 260px;column-gap:16px}
.mosaic figure{margin:0 0 16px;break-inside:avoid;display:flex;flex-direction:column;gap:6px}
.mosaic img{border-radius:6px;width:100%;transform:translateY(var(--py,0));will-change:transform}
.mosaic figcaption{font-size:13px;color:var(--muted)}

blockquote{margin:0;font-family:var(--f-display);font-weight:300;font-size:clamp(30px,4vw,56px);line-height:1.1;letter-spacing:-.015em;max-width:22ch}
blockquote cite{display:block;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:18px;font-style:normal}

.next{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.next a{padding:48px 0;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.next a:last-child{text-align:right;align-items:flex-end}
.next b{font-family:var(--f-display);font-size:clamp(26px,3.4vw,44px);font-weight:800;letter-spacing:-.02em}
.next a:hover b{color:var(--accent)}
.note{color:var(--muted);font-size:13px;padding-block:24px 40px;border-top:1px solid var(--line)}

.soon{min-height:100vh;display:grid;place-items:center;text-align:center;gap:16px;padding-block:20vh}
.soon h1{font-family:var(--f-display);font-size:clamp(44px,8vw,110px);font-weight:800;margin:0;letter-spacing:-.03em}

@media (max-width:760px){
  .feature{grid-template-columns:minmax(0,1fr)}
  .slide,.slide.tall{width:82vw}
  .next{grid-template-columns:1fr}
  .next a:last-child{text-align:left;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .hero h1 span{transform:none;opacity:1}
  .manifesto .w{opacity:1}
  .reveal{clip-path:none}
}
</style>
</head>
<body>
<header class="top gut"><a href="index.html">← Globo</a><a class="sp" href="dados.html">Dados</a></header>
<main id="app"></main>

<script>
/* Conteúdo de cada diário. Fotos escolhidas na pasta do Drive; legendas provisórias, a conferir com quem viajou.
   Os números vêm da mesma base de exemplo do globo (fictícios). */
const ORDEM=["brasil","peru","chile","colombia","mexico","espanha","portugal","sao-tome","cabo-verde","guine-bissau","angola","mocambique","argentina"];
const NOMES={brasil:"Brasil",peru:"Peru",chile:"Chile",colombia:"Colômbia",mexico:"México",espanha:"Espanha",portugal:"Portugal","sao-tome":"São Tomé e Príncipe","cabo-verde":"Cabo Verde","guine-bissau":"Guiné-Bissau",angola:"Angola",mocambique:"Moçambique",argentina:"Argentina"};
const DIARIOS={
 "sao-tome":{
  cores:["#12862B","#C89B00","#D21034"],
  flag:'<rect width="30" height="20" fill="#12AD2B"/><rect y="6" width="30" height="8" fill="#FFCE00"/><path d="M0 0L9 10L0 20z" fill="#D21034"/><path d="M15 8.2l.5 1.4h1.5l-1.2.9.5 1.4-1.3-.9-1.3.9.5-1.4-1.2-.9h1.5zM22 8.2l.5 1.4h1.5l-1.2.9.5 1.4-1.3-.9-1.3.9.5-1.4-1.2-.9h1.5z" fill="#000"/>',
  quando:"15 a 17 de junho de 2026",
  capa:["capa","Baía da cidade de São Tomé"],
  manifesto:"Três dias em <b>São Tomé e Príncipe</b>, entre o posto sanitário de bairro e as salas do ministério, para ouvir quem cuida da saúde de perto e entender de onde vem a informação que chega até eles.",
  numeros:[["2","municípios visitados"],["3","dias de campo"],["65","entrevistas (exemplo)"]],
  galeria:[["posto-pantufo","Posto Sanitário de Pantufo","Área de saúde de Água Grande",1],["parceiros","Equipe com parceiros locais","Encontro institucional",0],["rua","Rua de São Tomé","Cotidiano da cidade",1],["barco","Barco na baía","Litoral de São Tomé",1],["cidade","Táxis amarelos no centro","Cidade de São Tomé",0]],
  destaque:["equipe-medico","Na unidade de saúde","A equipe do ECoS com um profissional da unidade visitada. Foi nessas conversas que apareceram as fontes em que os profissionais confiam e os caminhos por onde a informação errada chega."],
  voz:["A rádio comunitária ainda é o caminho mais rápido para corrigir uma informação errada.","Técnico(a) de enfermagem · trecho fictício"],
  mosaico:[["praia","Praia ao fim do dia"],["chocolate","Chocolate da roça, produto local"],["bandeira","A equipe com a bandeira do país"],["barco","Pesca artesanal"]]
 }
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=(slug,n,p)=>`fotos/${slug}/${n}${p?"-p":""}.jpg`;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function render(){
  const slug=(location.hash||"#sao-tome").slice(1), d=DIARIOS[slug], nome=NOMES[slug]||"País";
  const i=ORDEM.indexOf(slug), prev=ORDEM.at(i-1), next=ORDEM.at((i+1)%ORDEM.length);
  document.title=`${nome} · Diário de campo`;
  const nav=`<nav class="next wrap gut"><a href="#${prev}"><span class="mono">Anterior</span><b>${esc(NOMES[prev])}</b></a><a href="#${next}"><span class="mono">Próximo</span><b>${esc(NOMES[next])}</b></a></nav>`;
  if(!d){$("#app").innerHTML=`<section class="soon gut"><span class="mono">Diário de campo</span><h1>${esc(nome)}</h1><p>As fotos deste país ainda vão ser escolhidas na pasta do Drive.</p><p><a href="index.html#${slug}">Voltar ao capítulo no globo</a></p></section>${nav}`;document.documentElement.style.setProperty("--accent","#12862B");return}
  const r=document.documentElement.style;r.setProperty("--accent",d.cores[0]);r.setProperty("--accent2",d.cores[1]);r.setProperty("--accent3",d.cores[2]);
  const man=d.manifesto.replace(/(<b>.*?<\/b>)|([^\s<]+)/g,(m,b,w)=>b?`<b>${b.slice(3,-4).split(" ").map(x=>`<span class="w">${x}</span>`).join(" ")}</b>`:`<span class="w">${w}</span>`);
  $("#app").innerHTML=`
  <section class="hero"><div class="stick">
    <div class="img" id="himg" style="background-image:url('${src(slug,d.capa[0])}')"></div><div class="shade"></div>
    <div class="t wrap gut" style="width:100%"><div class="meta"><svg class="flag" viewBox="0 0 30 20" role="img" aria-label="Bandeira">${d.flag}</svg><span class="mono">Diário de campo · ${esc(d.quando)}</span></div>
      <h1>${nome.split(" ").map(w=>`<span>${esc(w)}</span>`).join(" ")}</h1></div>
    <span class="cap mono">${esc(d.capa[1])}</span></div></section>
  <section class="manifesto wrap gut"><p id="man">${man}</p></section>
  <section class="wrap gut"><div class="facts">${d.numeros.map(([n,l])=>`<div><b>${n}</b><span>${esc(l)}</span></div>`).join("")}</div></section>
  <section class="hscroll" id="hs"><div class="stick">
    <div class="hhead wrap gut" style="width:100%"><h2>Por onde passamos</h2><span class="mono">role para ver →</span></div>
    <div class="track" id="track">${d.galeria.map(([f,t,s,tall])=>`<figure class="slide${tall?" tall":""}"><div class="frame"><img src="${src(slug,f)}" alt="${esc(t)}" loading="lazy"></div><figcaption><b>${esc(t)}</b><span class="mono">${esc(s)}</span></figcaption></figure>`).join("")}</div>
  </div></section>
  <section class="sec wrap gut"><div class="feature">
    <div class="reveal" id="rv"><img src="${src(slug,d.destaque[0])}" alt="${esc(d.destaque[1])}" loading="lazy"></div>
    <div><span class="mono">Encontros</span><h3>${esc(d.destaque[1])}</h3><p>${esc(d.destaque[2])}</p></div></div></section>
  <section class="sec wrap gut"><blockquote>“${esc(d.voz[0])}”<cite>${esc(d.voz[1])}</cite></blockquote></section>
  <section class="sec wrap gut" style="padding-top:0"><h2>Mais do campo</h2><div class="mosaic">${d.mosaico.map(([f,t],k)=>`<figure><img src="${src(slug,f)}" alt="${esc(t)}" loading="lazy" data-sp="${[.06,-.04,.09,-.06][k%4]}"><figcaption>${esc(t)}</figcaption></figure>`).join("")}</div></section>
  ${nav}
  <p class="note wrap gut">Protótipo. Fotos da pasta do projeto no Drive, com legendas provisórias. Números e trecho de fala são exemplos fictícios. Antes de publicar, conferir a autorização de uso de imagem das pessoas que aparecem.</p>`;
  scrollTo(0,0);setup();
}

let raf=0;
function setup(){
  requestAnimationFrame(()=>document.documentElement.classList.add("ready"));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.25});
  document.querySelectorAll(".slide,.reveal").forEach(el=>io.observe(el));
  onScroll();
}
function onScroll(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  const vh=innerHeight;
  const himg=$("#himg");if(himg&&!reduce){const k=Math.min(1,scrollY/vh);himg.style.transform=`scale(${1.12-0.12*k})`;const ins=k*6;himg.style.clipPath=`inset(${ins}% ${ins}% ${ins}% ${ins}% round ${k*18}px)`}
  const man=$("#man");if(man){const r=man.getBoundingClientRect(),ws=man.querySelectorAll(".w"),p=Math.max(0,Math.min(1,(vh*.85-r.top)/(r.height+vh*.35)));const n=Math.round(p*ws.length);ws.forEach((w,j)=>w.classList.toggle("on",reduce||j<n))}
  const hs=$("#hs"),tr=$("#track");if(hs&&tr){const extra=Math.max(0,tr.scrollWidth-innerWidth+32);hs.style.height=(vh+extra)+"px";const top=hs.getBoundingClientRect().top;const k=Math.max(0,Math.min(1,-top/Math.max(1,extra)));tr.style.transform=`translateX(${-k*extra}px)`}
  if(!reduce)document.querySelectorAll(".mosaic img").forEach(im=>{const r=im.getBoundingClientRect();im.style.setProperty("--py",((r.top+r.height/2-vh/2)*(+im.dataset.sp))+"px")});
})}
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);
addEventListener("hashchange",render);render();
</script>
</body>
</html>
